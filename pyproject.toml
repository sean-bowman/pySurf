[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pysurf"
version = "0.1.0"
description = "Computational engineering portfolio: parametric surfboard design, hydrodynamics, and SPH water simulation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "plotly>=5.18",
    "trimesh>=4.0",
]

[project.optional-dependencies]
viewer = ["dash>=2.14"]
animations = ["manim>=0.18"]

[tool.setuptools.packages.find]
where = ["src"]
